# ============================================================================
# Deposit Dashboard — MONTHLY configuration (CASATIA-only)
# Build:  open compile_monthly_dashboard.ipynb in this folder and Run All.
#
# THIS FILE HOLDS TEXT, DATES AND SETTINGS ONLY — no file paths.
# Every file path (data files, framework.xlsx, the explainer images and the
# output .html) lives in the compile notebook, in its PATHS cell.
#
# ALL on-screen text lives here under `text:` (remarks, definitions, page_text,
# chart_help, hero). Remarks & definitions may embed {metric} tokens filled from
# the data (see TEXT_GUIDE.md). HTML tags are allowed in text.
#
# A few strings are DERIVED from the data/dates/settings and are left as `null`
# on purpose so they refresh automatically each period — freezing them would go
# stale. These are: page_subtitle, question_s4, caption_s1, caption_gm,
# caption_s5, chart_help.guide_s5, chart_help.s5_table, and the masthead date
# chip. Set any of them to a string to override. A small set of chart furniture
# (axis titles, "Others"/"Net", "Select all/Clear/Reset", the Actual/Forecast
# data labels, KPI micro-labels) is generated in code — ask if you want those
# exposed too.
# ============================================================================

cadence: monthly
# --- file paths: see the PATHS cell in the compile notebook ---
dates:
  baseline: '2026-07-31'
  latest: '2026-08-14'
  month_label: August 2026
  mtd_label: MTD 1–14 Aug 2026
  last_actual_month: '2026-07-31'
  forecast_months:
  - '2026-08-31'
  - '2026-09-30'
  - '2026-10-31'
  - '2026-11-30'
  - '2026-12-31'
  - '2027-01-31'
settings:
  annual_growth_target: 6000000000.0
  scenario_min_likelihood: 0.6
  scenario_topn_default: 5
  # Share of the balance Losing/Stagnant groups have ALREADY lost (measured as the
  # fall from each group's own 24-month high) that win-back could realistically
  # recover in a year. Pro-rated to the horizon by h/12 in the engine.
  # An assumption, not an estimate — replace it once win-back campaign results exist.
  rescue_recovery_rate: 0.20
  emphasis_floor: 0.1
  # how many strategies to list for the selected lever
  strategies_shown: 3
  # weight used when a Scenario row's Weightage cell is blank or not a number
  strategy_weight_default: 50
  # materiality floors for the reasoning text — slices below these are flagged
  # in assets/reasoning.csv so nobody writes commentary on noise
  reasoning_min_balance: 50000000.0
  reasoning_min_accounts: 50
  # hard cap on cells the forecast pivot will draw before it refuses and explains why
  pivot_max_cells: 20000
  masthead_color: '#800000'
text:
  lever_labels:
    The Sails: Share-of-Wallet Maximization
    The Catch: Strategic NTB Acquisition
    The Radar: Proactive Churn Mitigation
    The Rescue: Win-Back & Reactivation
  # Short forms used as the radar's axis labels (full names appear on hover)
  lever_short:
    The Sails: SOW Maxing
    The Catch: NTB Acq
    The Radar: Churn Mit
    The Rescue: Win-Back
  # Scenario Planner "Planning case" slider — 5 stops (low -> high).
  # Renaming these does not change the maths; each stop shifts expected growth by
  # -1, -0.5, 0, +0.5, +1 standard deviations of the portfolio's own volatility.
  scenario_cases:
    title: Planning case
    names:
    - Worst Case
    - Bad Case
    - Expected Case
    - Better Case
    - Best Case
    notes:
    - Plans at a level the portfolio would usually beat — about a 1-in-6 chance of coming in below it.
    - A cautious level, below the model's own forecast.
    - The model's own forecast — an even-odds outcome.
    - A stretch above the model's own forecast.
    - The portfolio would need to beat its own trend — about a 1-in-6 chance of doing better.
    help: Choose where in the forecast's range to plan. The expected case is the model's own number;
      the worst and best cases are equally likely to be wrong in either direction — moving the slider
      changes the risk you accept, not the forecast itself.
  # forecast pivot wording (Rows / Columns / Values / Filters and its notes)
  pivot:
    rows: 'Rows'
    cols: 'Columns'
    vals: 'Values'
    filters: 'Filters'
    none: '(none)'
    all: 'All'
    total: 'total'
    grand: 'Grand total'
    month: 'Month'
    month_pin: 'Month shown'
    type: 'Period'
    type_all: 'Actual + forecast'
    type_a: 'Actual only'
    type_f: 'Forecast only'
    type_l12: 'Last 12 months + forecast'
    type_l6: 'Last 6 months + forecast'
    t_ac: 'actual'
    t_fc: 'forecast'
    unmapped: 'Unmapped'
    reset: 'Reset layout'
    m_bal: 'Total Balance'
    m_noa: 'Total NOA'
    m_tkt: 'Ticket Size'
    stock_note: 'Balance and accounts are month-end positions, not flows, so they are never added across months. Ticket Size is recomputed as balance ÷ accounts in every cell and every total, never averaged.'
    fc_note: 'Shaded = forecast months, not actuals.'
    one_month: 'Month is on neither axis, so the table shows {m} only ({t}).'
    empty: 'No data for the current selection.'
    no_value: 'Tick at least one measure under Values.'
    no_total: 'Totals that would add one month-end to another are omitted on purpose — a balance held in June and again in July is the same money, not twice as much.'
    too_big: 'This layout would draw {n} cells, over the {max} limit. Put fewer fields on Rows or Columns, pin a filter, or show fewer measures.'
  why_panel:
    horizon_label: 'Look back / ahead:'
    past_kicker: 'What happened · {from} – {to}'
    fut_kicker: 'What is projected · {from} – {to}'
    past_up: 'Balance rose <span class="p">{amt}</span>'
    past_down: 'Balance fell <span class="n">{amt}</span>'
    fut_up: 'Balance rises <span class="p">{amt}</span>'
    fut_down: 'Balance falls <span class="n">{amt}</span>'
    acc_up: '▲ <b>More accounts</b> — {n} opened, adding <span class="up">{amt}</span>'
    acc_down: '▼ <b>Fewer accounts</b> — {n} net closures, taking <span class="dn">{amt}</span> out'
    tkt_up: '▲ <b>Bigger balances</b> — average per account moves RM {k0} → RM {k1}, adding <span class="up">{amt}</span>'
    tkt_down: '▼ <b>Smaller balances</b> — average per account moves RM {k0} → RM {k1}, taking <span class="dn">{amt}</span> out'
    sub_win_thin: You won customers, but each one held less.
    sub_lose_deep: Fewer customers, but each one held more.
    sub_both_up: More customers, and each one holding more.
    sub_both_down: Fewer customers, and each one holding less.
    lens_head: 'The same {amt}, seen three ways'
    lens_note: — different cuts of the same money, not separate movements.
    chart_show: Show chart
    chart_wf: Waterfall
    chart_bar: Bar
    cut_note: 'Note: the past panel is cut by {dim}.'
    context_label: 'Context'
  strategy_panel:
    title: Recommended strategies
    tag: Strategy
    highest: highest
    one: strategy
    many: strategies
    empty: No strategy is defined for this lever yet — add a row for it on the Scenario
      sheet of framework.xlsx.
    more: more in framework.xlsx
    hint: Click a lever on the right, or a point on the radar, to read its strategies.
    col_lever: Lever
    col_opp: Opportunity · Emphasis
    weight_label: 'Weight'
    weight_hint: 'Priority from the Weightage column of framework.xlsx — higher is offered first.'
    source: 'Source: Deposit Growth Navigation strategy library (framework.xlsx · Scenario
      sheet)'
  horizon_remarks:
    '1': |
      <b>Near-term, firm.</b> The selection is projected to move {net} by {month}.
    '3': |
      <b>Indicative.</b> The selection is projected to move {net} by {month}.
    '6': |
      <b>Directional only.</b> The selection is projected to move {net} by {month} — reliability falls with horizon, so treat this as a direction, not a number.
    label_grow: Top Grower
    label_decline: Top Depleter
    fallback_grow: No group is projected to grow.
    fallback_decline: No group is projected to decline.
  page_text:
    page_title: Retail Deposit Portfolio Optimization
    page_subtitle: null
    credit: prepared by Business Strategy & Intelligence (BSI)
    page1_name: Portfolio Steering
    page2_name: Understanding Growth
    page1_intro: Understanding recent performance, where it is headed, and what we can do to improve the
      trajectory.
    page2_intro: A deep dive into the factors behind the growth level.
    s1_title: Month-End Summary
    s3_title: Growth Matrix
    s4_title: Forecast
    s5_title: Scenario Planner
    question_s1: Where do we stand at the most recent month-end, and how is each product and customer
      type moving? (CASATIA scope)
    question_s3: Which customer groups are growing, stagnating or losing — by accounts and ticket size?
      (CASATIA scope, 6-month window)
    question_s4: null
    question_s5: If we want to grow RM X in N months — where should we focus, and how likely is each segment
      to deliver?
    caption_s1: CASATIA portfolio (forecast dataset). Balance is the latest actual month-end; MoM = change
      vs the prior month-end; YTD = change since December; the forecast column is the model’s next month-end.
      Whole-portfolio coverage will be added in a later phase.
    caption_gm: null
    caption_s5: null
  chart_help:
    guide_s1: 'Reading guide: the three cards give the CASATIA position at the most recent month-end —
      balance with its month-on-month move, growth since year start, and the model''s next month-end forecast.
      The table breaks the same figures down by product and customer type (green adds, red subtracts).'
    s1_table:
    - Month-end position and growth by product and customer type; red parentheses = negative.
    - 'CASATIA products x Individual / SME / Non-SME. Column groups: Balance at the latest month-end,
      MoM Growth (vs the prior month-end), YTD Growth (since December) and the model’s next month-end
      forecast. All in K/M/B (2 dp), each group scaled to its own magnitude.'
    guide_s3: 'Reading guide: the Growth Matrix classifies CASATIA customer groups by their 6-month direction
      (31 Jan → 31 Jul) — account growth on the x-axis, ticket-size growth on the y-axis. Use the Matrix
      group chips to focus on any of the five groups; the cards, line chart and dimension charts below
      recompute from your selection. Switch the 6-month measure between NOA and Ticket Size.'
    s3_matrix:
    - Customer groups classified by 6-month growth direction.
    - 'x-axis: NOA growth; y-axis: ticket-size growth. Growing = more accounts & bigger tickets; Broadening
      = more accounts, smaller tickets; Shrinking = fewer, bigger; Losing = fewer & smaller; Stagnant
      = little change. Block values: balance and NOA of the sliced selection; greyed blocks are excluded
      by the Matrix group chips.'
    s3_line:
    - Recent 6-month trend of accounts (left axis) and ticket size (right axis) for the current selection.
    - Month-end NOA and average ticket size (balance ÷ accounts) over the matrix window. Rising accounts
      with falling ticket size = broadening; the reverse = concentration. Both axes are dynamic.
    s3_wf:
    - 6-month change by the chosen dimension; bars sum to the selection net.
    - 'NOA: each bar is the category''s change in accounts. Ticket Size: bars are NOA-weighted contributions
      to the portfolio''s ticket-size change — (Δbalance − opening ticket × ΔNOA) ÷ closing NOA — so they
      genuinely sum to the net RM/account change.'
    s3_pie:
    - Share of the 6-month change by the chosen dimension.
    - Slices are absolute shares; a slice can represent a negative change (sign shown on the label). Centre
      = signed net. Occupation shows top 10 + Others.
    s3_bar:
    - Ranked 6-month change by the chosen dimension.
    - Green = positive, red = negative, sorted by value. Best view for high-cardinality dimensions.
    guide_s4: 'Reading guide: CASATIA portfolio only, and a preliminary univariate forecast.
      The fan chart shows history and up to a 6-month forecast with its confidence band, which widens
      the further out it reaches — the further we forecast, the less reliable it is. Pick a horizon (+1
      to +6 months) to break that growth down by dimension. Slicers recompute everything.'
    s4_fan:
    - Month-end history with a forecast up to 6 months and a confidence band that widens the further out
      it reaches.
    - 'Solid line = actuals since 2023; dashed = forecast; shaded band = forecast range, widening with
      horizon (the further we forecast, the less reliable it is). Switch measure: Total Balance / Total
      NOA / Ticket Size.'
    s4_wf:
    - Forecast growth to the selected horizon by the chosen dimension; bars sum to Net.
    - Growth = forecast month-end minus the last actual month-end, per category. Change the horizon with
      the +1/+2/+3 pills. Occupation shows top 10 + Others.
    s4_pie:
    - Share of forecast growth by the chosen dimension.
    - Slices are absolute shares of the horizon growth; signs shown on labels; centre = signed net.
    s4_bar:
    - Ranked forecast growth by the chosen dimension.
    - Green = positive, red = negative, sorted by value, for the selected horizon.
    guide_s5: null
  hero:
    headline: Steering the retail deposit portfolio to its <b>annual growth target</b>
    lead: This dashboard is the <em>Compass</em> of the proposed <em>Deposit Growth Navigation</em> framework
      — it tracks where liquidity is moving and where it is likely to go next, so that management can
      decide <em>where to act</em>, <em>with which lever</em>, and <em>how much it must deliver</em> to
      reach the target.
    badge_1: Proposed framework · Business Strategy &amp; Intelligence
    badge_2: Phase 1 — Compass live · growing into a comprehensive Deposit Optimizer Engine
    how_to_read: <b>How to read:</b> Page 1 — where the portfolio stands and where it is heading. Page 2 —
      why, and where each lever should aim.
    expand_label: Expand all
    collapse_label: Collapse all
    # 'Full detail' panel — labels only; the content itself is read live from
    # the Framework sheet of framework.xlsx at build time.
    detail_label: Full detail
    detail_close_label: Close
    detail_question_label: Question it answers
    detail_source: 'Source: Deposit Growth Navigation — Operating Framework (framework.xlsx
      · Framework sheet)'
    cards:
      compass:
        kicker: The Compass · this dashboard
        name: Actionable Deposit Forecasting
        desc: Predicts where funds are likely moving rather than relying on historical data alone, and
          sizes the gap to the annual growth target.
        look: 'In this dashboard: {sec1} · {sec4} · {sec5} · {sec3}'
        status: Live — Phase 1
        open: true
      sails:
        kicker: The Sails
        name: Share-of-Wallet Maximization
        desc: Cross-sell and upsell efforts to increase existing customers' ticket size.
        look: 'Where to look now: {sec3:Growing &amp; Broadening groups}'
      radar:
        kicker: The Radar
        name: Proactive Churn Mitigation
        desc: Proactive effort to prevent customers from depleting deposits and/or churning (pre-event).
        look: 'Where to look now: {sec3:Losing &amp; Shrinking groups}'
      catch:
        kicker: The Catch
        name: Strategic NTB Acquisition
        desc: New-to-bank acquisition through marketing, ground outreach and business partnerships.
        look: 'Where to look now: {sec4:NTB contribution in Forecast}'
      rescue:
        kicker: The Rescue
        name: Win-Back &amp; Reactivation
        desc: Re-engages deposit-depleted and churned customers using tiered recovery efforts calibrated
          to their long-term value (post-event).
        look: 'Where to look now: {sec3:Stagnant &amp; Losing groups in the Growth Matrix}'
